<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lugano Parking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5f68"/>
      <stop offset="1" stop-color="#17909a"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the lake -->
  <g clip-path="url(#round)" fill="#ffffff" opacity="0.10">
    <path d="M0 392 C 90 352 170 352 256 392 S 422 432 512 392 V512 H0 Z"/>
  </g>
  <g clip-path="url(#round)" fill="#ffffff" opacity="0.07">
    <path d="M0 440 C 90 400 170 400 256 440 S 422 480 512 440 V512 H0 Z"/>
  </g>
  <!-- the P -->
  <path d="M176 392 V138 H290 A78 78 0 0 1 290 294 H176" fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
