<style>
/* Layout: one-screen map app. Map fills the viewport; a floating header on top, a draggable sheet from the bottom. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eef1f0; --fg:#15201e; --muted:#5f6b68; --line:#dde3e1;
  --accent:#0f6f78; --accent-ink:#ffffff; --accent-soft:#dff0f1;
  --ok:#1f8a4c; --ok-soft:#dcf3e4; --warn:#c7791a; --warn-soft:#fbeed9; --bad:#c8362f; --bad-soft:#f9e1df;
  --blue:#2a62c9; --blue-soft:#dbe6fa; --white-zone:#6b5bd2; --white-soft:#e7e3f8; --yellow:#b58a00; --yellow-soft:#f6edc6;
  --shadow:0 8px 28px rgba(16,32,30,.16), 0 1px 3px rgba(16,32,30,.08);
  --font-display:"Sora","Instrument Sans",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --map-filter:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#1a2220; --surface-2:#232d2b; --fg:#eef3f1; --muted:#9aa8a4; --line:#2f3b38;
  --accent:#4fb8c0; --accent-ink:#0b1514; --accent-soft:#163a3d;
  --ok:#4fc77f; --ok-soft:#173d28; --warn:#e5a04a; --warn-soft:#3f2d14; --bad:#ef6b63; --bad-soft:#45201e;
  --blue:#6f9cf0; --blue-soft:#1d2d4d; --white-zone:#a89cf3; --white-soft:#2b2650; --yellow:#e2c14e; --yellow-soft:#3c3414;
  --shadow:0 8px 28px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --map-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.7);
  color-scheme:dark;
}}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;width:100%;overflow:hidden;--peek:124px;--top:82px;--tab:56px;--safe-b:env(safe-area-inset-bottom,0px)}
#map{position:absolute;inset:0;background:var(--bg);z-index:0}
#map .mosaic-layer{filter:var(--map-filter)}
#map .leaflet-gl-layer{opacity:0;transition:opacity .4s}
#map.gl-on .leaflet-gl-layer{opacity:1}
#map.gl-on .mosaic-layer{visibility:hidden}
.maplibregl-map{font:inherit}
.maplibregl-canvas{outline:none}
.leaflet-container{font-family:var(--font-body)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);padding:2px 6px}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-bottom.leaflet-right{bottom:calc(var(--peek,124px) + var(--tab) + var(--safe-b) + 6px)}
.leaflet-top.leaflet-left .leaflet-control-zoom{margin-top:calc(env(safe-area-inset-top,0px) + var(--top));margin-left:12px;border:0;box-shadow:var(--shadow);border-radius:12px;overflow:hidden}
.leaflet-bar a{background:var(--surface);color:var(--fg);border-bottom-color:var(--line);width:36px;height:36px;line-height:36px}
.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-bar a.leaflet-disabled{color:var(--muted);background:var(--surface-2)}
.leaflet-top.leaflet-left .leaflet-control-locate{margin-left:12px;margin-top:8px;border:0;box-shadow:var(--shadow);border-radius:12px;overflow:hidden}
.leaflet-control-locate .locate{width:36px;height:36px;display:grid;place-items:center;background:var(--surface);color:var(--fg)}
.leaflet-control-locate .locate svg{width:19px;height:19px}
.leaflet-control-locate .locate.on{color:var(--accent)}
.leaflet-control-locate .locate.locating svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.85)}}
.me{position:relative}
.me .pin{position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:#2a7fff;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%)}
.me .halo{position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:#2a7fff;opacity:.35;transform:translate(-50%,-50%);animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:translate(-50%,-50%) scale(1);opacity:.4}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}

/* Header */
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px}
.brand .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden}
.brand .mark svg{display:block;width:36px;height:36px}
.brand h1{font-size:17px;font-weight:600;line-height:1.1}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.stale{background:var(--warn)}
.brand .grow{flex:1;min-width:0}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:4px;gap:4px}
.seg button{padding:9px 10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.seg svg{width:16px;height:16px;flex:none}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg3 button{padding:9px 6px;font-size:13.5px;gap:6px;white-space:nowrap}

/* Going to */
#map.picking{cursor:crosshair}
#map.picking .leaflet-interactive{pointer-events:none}
.dmark{position:relative}
.dmark .flag{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50% 50% 50% 4px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transform:translate(-4px,-34px);box-shadow:var(--shadow);border:2px solid var(--surface)}
.dmark .flag svg{width:18px;height:18px}
.dmark .lbl{position:absolute;left:34px;top:-30px;background:var(--surface);color:var(--fg);font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--surface-2);border-radius:14px;padding:4px 4px 4px 12px}
.search .ico{color:var(--muted);display:grid;place-items:center;flex:none}
.search .ico svg{width:18px;height:18px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;background:none;border:0;color:var(--fg);padding:9px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.pickbtn{flex:none;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:8px 11px;border-radius:11px;background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pickbtn svg{width:15px;height:15px}
.pickbtn.on{background:var(--accent);color:var(--accent-ink)}
.results{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);text-align:left;width:100%}
.res .t{min-width:0;display:flex;flex-direction:column}
.res b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spot{display:flex;flex-direction:column;gap:2px;padding:12px 12px;border-radius:14px;background:var(--surface-2);text-align:left}
.spot b{font-weight:600;font-size:14px}
.spot small{font-size:12px;color:var(--muted)}
.spot:active{transform:scale(.98)}
.dest{display:flex;align-items:center;gap:10px}
.dest .ico{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.dest .ico svg{width:18px;height:18px}
.dest .grow{flex:1;min-width:0}
.dest .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dest h2{font-size:18px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest p{margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sortbar.durs{margin-top:12px;margin-bottom:0}
.sortbar .lbl{flex:none;font-size:12.5px;color:var(--muted);font-weight:600;align-self:center;padding-right:2px}
.gcard{grid-template-columns:56px 1fr auto}
.gcard .walk{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:var(--surface);color:var(--c)}
.gcard .walk svg{width:16px;height:16px;margin-bottom:1px}
.gcard .walk b{font-family:var(--font-display);font-size:18px;line-height:1;font-weight:700}
.gcard .walk small{font-size:10.5px;color:var(--muted);margin-top:2px}
.gcard.full .walk b{font-size:13px}
.gcard.full{opacity:.75}
.gcard .t h3{white-space:normal;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gcard .t h3 .chip{font-size:10.5px;padding:2px 7px}
.card.gcard .n b{font-size:17px;color:var(--fg)}
.card.gcard.full .n b{color:var(--muted)}
.gcard.best{outline:2px solid var(--accent);outline-offset:-2px}

/* Markers */
.gmark{position:relative}
.gmark .pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 9px 4px 6px;font-family:var(--font-display);font-weight:700;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:5px;white-space:nowrap;border:2px solid var(--c)}
.gmark .pill::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--c);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.gmark .pill .p{width:18px;height:18px;border-radius:6px;background:var(--c);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.gmark.active .pill{transform:translate(-50%,-100%) scale(1.12)}
.gmark.nodata .pill{color:var(--muted);border-style:dashed}
.zlabel{background:transparent;border:0;box-shadow:none}
.zlabel span{display:inline-block;background:var(--surface);color:var(--fg);font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;box-shadow:var(--shadow);border-left:4px solid var(--c);white-space:nowrap;transform:translate(-50%,-50%)}

/* Bottom sheet */
.sheet{position:absolute;left:0;right:0;bottom:calc(var(--tab) + var(--safe-b));z-index:6;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(16,32,30,.18);transform:translateY(calc(100% - var(--peek,124px)));transition:transform .32s cubic-bezier(.2,.8,.2,1);height:calc(min(86%,760px) - var(--tab));display:flex;flex-direction:column;touch-action:none}
.sheet.dragging{transition:none}
.sheet.half{transform:translateY(46%)}
.sheet.full{transform:translateY(0)}
.sheet{overflow:hidden}
.sheet .listview,.sheet.detail-mode .detail{display:flex;flex-direction:column;flex:1;min-height:0}
.sheet .grip{padding:10px 0 4px;display:grid;place-items:center;flex:none}
.sheet .grip i{width:40px;height:5px;border-radius:3px;background:var(--line);display:block}
.sheet .head{padding:4px 18px 10px;flex:none}
.sheet .body{overflow:auto;flex:1;min-height:0;padding:0 14px 24px;touch-action:pan-y;overscroll-behavior:contain}
.sheet:not(.full) .body{touch-action:none}
.sheet .body::-webkit-scrollbar{width:0}
.summary{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.summary .big{font-size:28px;font-weight:700;line-height:1}
.summary .lbl{font-size:14px;color:var(--muted)}
.summary .chips{margin-left:auto;display:flex;gap:6px}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.white{background:var(--white-soft);color:var(--white-zone)}
.chip.yellow{background:var(--yellow-soft);color:var(--yellow)}
.sortbar{display:flex;gap:6px;margin:10px 0 6px;overflow-x:auto;padding-bottom:2px}
.sortbar button{flex:none;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.sortbar button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.sortbar button{display:inline-flex;align-items:center;gap:5px}
.sortbar button svg{width:14px;height:14px}
.card .t p .dist{color:var(--fg);font-weight:600}
.zcard.here{outline:2px solid var(--c);outline-offset:-2px}
.note.here-none{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:11px 12px;margin-top:0}
.note.here-none svg{width:16px;height:16px;flex:none;margin-top:1px}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 12px;border-radius:16px;background:var(--surface-2);text-align:left;width:100%;position:relative}
.card:active{transform:scale(.99)}
.card .ring{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--pct)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.card .ring i{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--c);font-family:var(--font-display);font-style:normal}
.card .t{min-width:0}
.card .t h3{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-body)}
.card .t p{margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n{text-align:right}
.card .n b{display:block;font-size:24px;font-weight:700;line-height:1;color:var(--c)}
.card .n small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.card.nodata .n b{font-size:14px;color:var(--muted);font-weight:600}
.zcard{grid-template-columns:auto 1fr auto}
.zcard .sw{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--c)}
.zcard .sw svg{width:24px;height:24px}
.zcard .n{font-size:13px;color:var(--muted)}
.zcard .n .st{display:inline-block;font-weight:700;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--c)}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.now{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-top:10px}
.now .tile{border-radius:16px;padding:12px;background:var(--soft);color:var(--fg);min-width:0}
.now .tile .k{font-size:12px;font-weight:600;color:var(--c);display:flex;align-items:center;gap:6px}
.now .tile .k svg{width:16px;height:16px;flex:none}
.now .tile .v{font-family:var(--font-display);font-weight:700;font-size:18px;margin-top:4px;line-height:1.15}
.now .tile .s{font-size:12px;color:var(--muted);margin-top:4px}
.note{font-size:12.5px;color:var(--muted);margin:12px 2px 0;line-height:1.45}
.note a{color:var(--accent)}

/* Detail panel (inside sheet) */
.detail{display:none}
.sheet.detail-mode .listview{display:none}
.sheet.detail-mode .detail{display:flex}
.dhead{display:flex;align-items:flex-start;gap:10px}
.dhead .back{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.dhead .back svg{width:18px;height:18px}
.dhead h2{font-size:20px;font-weight:700;line-height:1.15}
.dhead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.hero .box{background:var(--surface-2);border-radius:16px;padding:12px;min-width:0}
.hero .box .k{font-size:12px;color:var(--muted);font-weight:600}
.hero .box .v{font-size:30px;font-weight:700;line-height:1.05;margin-top:4px;font-family:var(--font-display)}
.hero .box .v small{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--font-body)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--c);width:calc(var(--pct)*1%);border-radius:4px}
.rows{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row span:first-child{color:var(--muted)}
.row b{font-weight:600;text-align:right}
.tariff{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tariff div{background:var(--surface-2);border-radius:12px;padding:9px 6px;text-align:center}
.tariff div b{display:block;font-family:var(--font-display);font-size:16px}
.tariff div small{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px;background:var(--surface-2);color:var(--fg);text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn svg{width:18px;height:18px}
.disc{background:var(--surface-2);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.disc label{font-size:13px;color:var(--muted);font-weight:600}
.disc input{font:inherit;font-size:18px;font-family:var(--font-display);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.disc .out{font-size:14px}
.disc .out b{font-family:var(--font-display);font-size:20px;display:block;margin-top:2px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;flex:none;border:2px solid var(--c);background:var(--soft)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--peek,124px) + var(--tab) + var(--safe-b) + 16px);z-index:7;background:var(--fg);color:var(--surface);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.iconbtn.spin svg{animation:none}}
@media (min-width:720px){
  .top{left:16px;right:auto;width:400px}
  .tabbar{left:16px;right:auto;width:400px;bottom:16px;border-radius:16px;box-shadow:var(--shadow);padding-bottom:0;height:var(--tab)}
  .sheet{left:16px;right:auto;width:400px;border-radius:22px;bottom:calc(16px + var(--tab) + 8px);height:calc(min(80%,720px) - var(--tab) - 24px)}
  .sheet{transform:translateY(calc(100% - var(--peek,124px)))}
  .leaflet-top.leaflet-left .leaflet-control-zoom{margin-left:440px}
  .leaflet-top.leaflet-left .leaflet-control-locate{margin-left:440px}
  .leaflet-bottom.leaflet-right{bottom:6px}
  .toast{left:216px;bottom:calc(var(--peek,124px) + var(--tab) + 40px)}
}

/* Trend + EV charging */
.card .t p .tr{font-weight:600}
.gmark .pill .ar{font-size:12px;margin-left:-1px;color:var(--ac)}
.trend{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-size:13px;line-height:1.4}
.trend .ar{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:700;font-size:13px}
.trend b{color:var(--c)}
.cmark{position:relative}
.cmark .pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 7px 3px 4px;font-family:var(--font-display);font-weight:700;font-size:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:3px;white-space:nowrap;border:2px solid var(--c)}
.cmark .pill svg{width:14px;height:14px;color:var(--c)}
.cmark.active .pill{transform:translate(-50%,-50%) scale(1.15)}
.card .ring i svg{width:18px;height:18px}
.sortbar button[data-ev][aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rowbtn{width:100%;text-align:left;align-items:center}
.rows .rowbtn span:first-child{color:var(--fg);min-width:0}
.row small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.sec-ico{display:flex;align-items:center;gap:6px}
.sec-ico svg{width:14px;height:14px}

/* Events, favourites, vehicle height */
.event{background:var(--surface-2);border-radius:16px;padding:12px 14px;margin:2px 0 10px;border-left:4px solid var(--warn)}
.event .eh{display:flex;gap:10px;align-items:center}
.event .ei{font-size:22px;line-height:1}
.event .eh b{display:block;font-size:15px}
.event .eh small{display:block;color:var(--muted);font-size:12px}
.event p{margin:8px 0 6px;font-size:13px}
.ealt{display:flex;gap:6px;flex-wrap:wrap}
.ealt button{background:var(--surface);border-radius:12px;padding:7px 10px;text-align:left;border-left:3px solid var(--c)}
.ealt b{display:block;font-size:13px}
.ealt small{display:block;font-size:11.5px;color:var(--muted)}
.event .etip{color:var(--muted);font-size:12px;margin-bottom:0}
.esp{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;letter-spacing:.02em}
.evline{display:block;width:100%;margin-top:8px;padding:7px 10px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsel{flex:none;display:inline-flex;align-items:center;gap:2px;padding:0 2px 0 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:600;position:relative}
.vsel.on{background:var(--fg);color:var(--surface)}
.vsel svg{width:15px;height:15px;flex:none}
.vsel select{font:inherit;color:inherit;background:transparent;border:0;padding:6px 8px 6px 4px;appearance:none;-webkit-appearance:none;cursor:pointer;max-width:150px}
.vsel select option{color:#111;background:#fff}
.card.toolow{opacity:.55}
.gmark.toolow .pill{opacity:.5;filter:grayscale(1)}
.star{color:#d99a00}
.dhead > div{flex:1;min-width:0}
.dhead .fav{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.dhead .fav[aria-pressed="true"]{color:#d99a00}
.dhead .fav[aria-pressed="true"] svg{fill:currentColor}
.dhead .fav svg{width:20px;height:20px}
.warnstrip svg{width:18px;height:18px;flex:none}
.warnstrip{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:600}

/* Filters panel, driver reports */
.fchip{flex:none;display:inline-flex;align-items:center;gap:5px}
.fchip svg{width:14px;height:14px}
.sortbar .fchip.on{background:var(--fg);color:var(--surface)}
.fchip .fc{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px}
.fpanel{margin:4px 0 6px;padding:12px;border-radius:16px;background:var(--surface-2);display:grid;gap:10px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;font-size:14px;font-weight:600;text-align:left}
.frow span{display:flex;align-items:center;gap:8px}
.frow svg,.flabel svg{width:16px;height:16px}
.frow .sw{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .2s}
.frow .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.frow[aria-checked="true"] .sw{background:var(--accent)}
.frow[aria-checked="true"] .sw::after{left:19px}
.flabel{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.fopts{display:flex;flex-wrap:wrap;gap:6px}
.fopts button{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface);color:var(--muted)}
.fopts button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.fdone{justify-self:end;font-size:13px;font-weight:700;color:var(--accent);padding:2px 4px}

/* Bottom tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:8;height:calc(var(--tab) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--surface);display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(16,32,30,.06)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button:active{opacity:.7}

/* Parked bar */
.parked{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:8px 8px 8px 12px;font-size:13px;font-weight:600;border-left:4px solid var(--accent)}
.parked .ico{display:grid;place-items:center;color:var(--accent);flex:none}
.parked .ico svg{width:18px;height:18px}
.parked .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parked.warn{border-left-color:var(--warn)} .parked.warn .ico{color:var(--warn)}
.parked.bad{border-left-color:var(--bad)} .parked.bad .ico{color:var(--bad)}
.parked .pbtn{flex:none;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:7px 9px;border-radius:9px;background:var(--surface-2);color:var(--fg);text-decoration:none}
.parked .pbtn svg{width:15px;height:15px}
.btn.parked-on{background:var(--accent-soft);color:var(--accent)}

/* Typical occupancy chart */
.typ{background:var(--surface-2);border-radius:16px;padding:12px 14px 10px}
.typ .bars{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:56px;align-items:end}
.typ .bars i{display:block;height:var(--h);border-radius:3px 3px 1px 1px;background:var(--line);min-height:3px}
.typ .bars i.ok{background:var(--ok)} .typ .bars i.warn{background:var(--warn)} .typ .bars i.bad{background:var(--bad)}
.typ .bars i.none{background:var(--line);opacity:.6}
.typ .bars i.now{outline:2px solid var(--fg);outline-offset:1px}
.typ .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.typ p{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.typ p b{color:var(--fg)}

/* About modal */
.modal{position:absolute;inset:0;z-index:20;background:rgba(10,20,18,.45);display:flex;align-items:flex-end;justify-content:center}
.modal-card{background:var(--surface);color:var(--fg);width:100%;max-width:520px;max-height:88%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(16,32,30,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.modal-head h2{font-size:20px;font-weight:700}
.modal-body{overflow:auto;padding:0 18px calc(20px + var(--safe-b))}
.modal-body .sec:first-child{margin-top:6px}
.modal-body .btn{margin-top:4px}
body.modal-open .sheet,body.modal-open .tabbar{pointer-events:none}
@media (min-width:720px){.modal{align-items:center}.modal-card{border-radius:22px;max-height:80%}}

/* Install banner */
.banner{position:absolute;left:12px;right:12px;bottom:calc(var(--tab) + var(--safe-b) + 12px);z-index:9;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--surface);border-radius:16px;padding:10px 10px 10px 14px;box-shadow:var(--shadow)}
.banner .ico{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink)}
.banner .ico svg{width:16px;height:16px}
.banner .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.banner .txt b{font-size:13.5px;font-weight:600}
.banner .txt small{font-size:12px;opacity:.75}
.banner .pbtn{flex:none;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.14);color:inherit}
.banner .pbtn svg{width:15px;height:15px}
@media (min-width:720px){.banner{left:16px;right:auto;width:400px;bottom:calc(16px + var(--tab) + 12px)}}
.scard .t h3{font-size:14.5px}
</style>
</head>

const state={view:"garages",sort:"free",source:"snapshot",ts:new Date(SNAPSHOT_TS),counts:{},selected:null,pos:null,geo:false,dest:null,hours:2,gsort:"best",picking:false,parked:null};
try{ const h=parseFloat(localStorage.getItem("lp.hours")); if(h>0) state.hours=h; }catch(e){}
GARAGES.forEach(g=>state.counts[g.id]=g.free);

function levelOf(g){
  const f=state.counts[g.id];
  if(f==null) return {k:"nodata",c:"var(--muted)",t:t("No live data")};
  const pct=f/g.cap;
  if(f===0) return {k:"bad",c:"var(--bad)",t:t("Full")};
  if(f<15||pct<0.08) return {k:"bad",c:"var(--bad)",t:t("Almost full")};
  if(pct<0.25) return {k:"warn",c:"var(--warn)",t:t("Busy")};
  return {k:"ok",c:"var(--ok)",t:t("Plenty of space")};
}
const FEED="https://www.lugano.ch/vivere-lugano/muoversi-lugano/posteggi/content/0.html?ajax=true&ajaxAction=map";
function parseFeed(html){
  const out={}; const re=/<h5 class="mb-2">([^<]+)<\/h5>[\s\S]*?Posteggi liberi<\/strong><br>\s*(\d+)/g; let m;
  while((m=re.exec(html))){ const nm=m[1].split(" - ")[0].trim(); const g=GARAGES.find(x=>x.feedName===nm); if(g) out[g.id]=+m[2]; }
  return out;
}
async function fetchLive(){
  const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),7000);
  try{ const r=await fetch(FEED,{signal:ctrl.signal,cache:"no-store"}); if(!r.ok) throw 0; const c=parseFeed(await r.text()); if(Object.keys(c).length<3) throw 0; return c; }
  finally{ clearTimeout(tm); }
}
function applyCounts(c,source,ts){
  Object.assign(state.counts,c); state.source=source; state.ts=ts; if(source==="live"){ addReading(ts,c); saveCounts(); } renderAll();
}
async function refresh(manual){

  catch(e){ if(manual) toast(t("City feed not reachable from here · showing {what}",{what:t(state.source==="stored"?"the last stored update":"the saved snapshot")})); }

}

/* ---------- Location ---------- */
const LUGANO=[46.0036,8.9513];
function distKm(a,b){ const R=6371, toR=x=>x*Math.PI/180; const dLat=toR(b[0]-a[0]), dLng=toR(b[1]-a[1]); const h=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function fmtDist(km){ return km<0.95?Math.round(km*100)*10+" m":km<10?km.toFixed(1).replace(".0","")+" km":Math.round(km)+" km"; }
function garageDist(g){ return state.pos?distKm(state.pos,[g.lat,g.lng]):null; }
function inPoly(pt,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1]; if(((yi>pt[0])!==(yj>pt[0]))&&(pt[1]<(xj-xi)*(pt[0]-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
function zoneAt(pt){ for(const z of ZONES) for(const a of z.areas) if(inPoly(pt,a.p)) return {z,a}; return null; }
// Distance from a point to an area: zero inside, else the nearest polygon vertex or edge midpoint.
function areaDist(pt,poly){ if(inPoly(pt,poly)) return 0; let best=1e9; for(let i=0;i<poly.length;i++){ const a=poly[i], b=poly[(i+1)%poly.length]; for(const q of [a,[(a[0]+b[0])/2,(a[1]+b[1])/2]]) best=Math.min(best,distKm(pt,q)); } return best; }
let watchId=null, meMarker=null, meCircle=null, locBtn=null;
function geoError(e){
  state.geo=false; if(locBtn) locBtn.classList.remove("locating");
  toast(t(e&&e.code===1?"Location is off for this site · allow it in your browser settings":e&&e.code===3?"Could not get a fix · try again outside":"Location not available right now"));
}
function onPosition(p){
  const pt=[p.coords.latitude,p.coords.longitude]; const first=!state.pos; const moved=first||distKm(state.pos,pt)>0.03;
  state.pos=pt; state.geo=true; if(locBtn){ locBtn.classList.remove("locating"); locBtn.classList.add("on"); }
  if(!meMarker){ meMarker=L.marker(pt,{icon:L.divIcon({className:"me",iconSize:[0,0],html:'<span class="halo"></span><span class="pin"></span>'}),interactive:false,zIndexOffset:-100,keyboard:false}).addTo(map); }
  else meMarker.setLatLng(pt);
  const acc=p.coords.accuracy||0;
  if(acc>25&&acc<600){ if(!meCircle) meCircle=L.circle(pt,{radius:acc,weight:0,fillColor:"#2a7fff",fillOpacity:.1,interactive:false}).addTo(map); else { meCircle.setLatLng(pt); meCircle.setRadius(acc); } }
  else if(meCircle){ meCircle.remove(); meCircle=null; }
  if(first){
    const far=distKm(pt,LUGANO);
    if(far>25){ toast(t("You are {d} from Lugano · garages sorted by distance anyway",{d:fmtDist(far)})); }
    else if(state.view==="garages"){ const near=sortedGarages("near")[0]; const b=L.latLngBounds([pt,[near.lat,near.lng]]); map.flyToBounds(b,{paddingTopLeft:[40,170],paddingBottomRight:[40,Math.round(window.innerHeight*0.5)],maxZoom:16,duration:.7}); }
    else map.flyTo(pt,15.5,{duration:.7});
    if(state.view==="garages"&&!sheet.classList.contains("detail-mode")){ state.sort="near"; if(sheetPos==="peek") setSheet("half"); }
  }
  if(moved) renderAll();
  if(watchId==null&&navigator.geolocation){ watchId=navigator.geolocation.watchPosition(onPosition,()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:20000}); }
}
function locate(){
  if(!navigator.geolocation){ toast(t("Location is not supported on this device")); return; }
  if(locBtn) locBtn.classList.add("locating");
  if(state.pos&&meMarker){ map.flyTo(state.pos,Math.max(map.getZoom(),15.5),{duration:.5}); }
  navigator.geolocation.getCurrentPosition(onPosition,geoError,{enableHighAccuracy:true,maximumAge:30000,timeout:12000});
}
function pauseWatch(){ if(watchId!=null&&navigator.geolocation){ navigator.geolocation.clearWatch(watchId); watchId=null; } }

/* ---------- Typical occupancy (history collected by the GitHub Action on the "data" branch) ---------- */
const TYPICAL_URL="https://raw.githubusercontent.com/kf92gsbdmw-collab/lugano-parking/data/typical.json";
const DAY_KEYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const dayName=i=>t(DAY_KEYS[i]);
let typical=null;
async function loadTypical(){
  try{ const c=JSON.parse(localStorage.getItem("lp.typical")||"null"); if(c&&c.data&&c.data.garages){ typical=c.data; if(Date.now()-c.at<3*3600e3) return; } }catch(e){}
  try{ const r=await fetch(TYPICAL_URL,{cache:"no-store"}); if(!r.ok) return; const d=await r.json(); if(!d||!d.garages) return; typical=d; try{ localStorage.setItem("lp.typical",JSON.stringify({at:Date.now(),data:d})); }catch(e){} renderAll(); }catch(e){}
}
const hh=h=>String(h).padStart(2,"0")+":00";
function typicalFor(g,d){
  const ty=typical&&typical.garages&&typical.garages[g.id]; if(!ty) return null;
  d=d||new Date(); const wd=(d.getDay()+6)%7, h=d.getHours(); const day=ty.slots[wd]; const slot=day[h];
  let freesFrom=null; for(let x=h+1;x<24;x++){ if(day[x]&&day[x][0]>ty.cap*0.15){ freesFrom=x; break; } }
  return {wd,h,slot,day,cap:ty.cap,fullFrom:ty.fullFrom[wd],freesFrom,dayName:dayName(wd)};
}
// One short sentence for a card: what usually happens next, if the history has something to say.
function typicalHint(g){
  const ty=typicalFor(g); if(!ty) return ""; const f=state.counts[g.id];
  if(f===0||(f!=null&&f<ty.cap*0.1)){ if(ty.freesFrom!=null) return t("Usually frees up from {h}",{h:hh(ty.freesFrom)}); return ""; }
  if(ty.fullFrom!=null&&ty.h<ty.fullFrom) return t("Usually full from {h}",{h:hh(ty.fullFrom)});
  return "";
}
function typicalSection(g){
  if(!typical) return "";
  const ty=typicalFor(g); const f=state.counts[g.id];
  if(!ty||!ty.day.some(Boolean)) return `<div class="sec">${t("Typical occupancy")}</div><p class="note" style="margin-top:0">${t("Collecting data")}${typical.days?` (${typical.days===1?t("1 day so far"):t("{n} days so far",{n:typical.days})})`:""}. ${t("Patterns for this weekday appear after a few weeks of readings.")}</p>`;
  const bars=ty.day.map((s,i)=>{ const occ=s?1-s[0]/ty.cap:null; const lvl=occ==null?"none":occ>0.9?"bad":occ>0.75?"warn":"ok"; return `<i class="${lvl}${i===ty.h?" now":""}" style="--h:${occ==null?4:Math.max(6,Math.round(occ*100))}%" title="${hh(i)}${s?": "+t("about {n} free",{n:s[0]}):""}"></i>`; }).join("");
  const now=ty.slot?`${t("Usually about <b>{n} free</b> at this hour",{n:ty.slot[0]})}${f!=null?" "+t("(now {f})",{f}):""}.`:t("No readings for this hour yet.");
  const extra=ty.fullFrom!=null?` ${t("Typically full from {h}",{h:hh(ty.fullFrom)})}${ty.freesFrom!=null&&ty.freesFrom>ty.fullFrom?" "+t("until about {h}",{h:hh(ty.freesFrom)}):""}.`:" "+t("Rarely full on this weekday.");
  return `<div class="sec">${t("Typical {day}",{day:ty.dayName})}</div><div class="typ"><div class="bars">${bars}</div><div class="axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div><p>${now}${extra}</p></div>`;
}

/* ---------- Trend: is a garage filling or emptying? ---------- */
// Compares the latest count with a reading about 20 minutes earlier. Readings come from this phone
// (every refresh is remembered for 3 hours) and from the GitHub logger's log of today on the "data" branch.
const DATA_BASE="https://raw.githubusercontent.com/kf92gsbdmw-collab/lugano-parking/data/";
let hist=[]; // [{t: ms, c: {garageId: free}}], oldest first
function loadHist(){ try{ const h=JSON.parse(localStorage.getItem("lp.hist")||"[]"); if(Array.isArray(h)) hist=h.filter(x=>x&&x.t>Date.now()-3*3600e3&&x.c); }catch(e){} }
function saveHist(){ try{ localStorage.setItem("lp.hist",JSON.stringify(hist.slice(-90))); }catch(e){} }
function addReading(ts,c){
  const t0=ts.getTime(); if(hist.some(x=>Math.abs(x.t-t0)<60e3)) return;
  hist.push({t:t0,c:Object.assign({},c)}); hist.sort((a,b)=>a.t-b.t); hist=hist.filter(x=>x.t>Date.now()-3*3600e3); saveHist();
}
const zurichDay=d=>new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Zurich",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
let logAt=0;
async function loadRecentLog(){
  if(Date.now()-logAt<4*60e3) return; logAt=Date.now();
  try{
    const r=await fetch(DATA_BASE+"log/"+zurichDay(new Date())+".csv",{cache:"no-store"}); if(!r.ok) return;
    const cut=Date.now()-3*3600e3, by={};
    for(const line of (await r.text()).trim().split("\n").slice(1)){ const [ts,g,f]=line.split(","); const t0=Date.parse(ts); if(!(t0>cut)||f==null) continue; (by[t0]=by[t0]||{})[g]=+f; }
    let added=0; for(const k in by){ const t0=+k; if(!hist.some(x=>Math.abs(x.t-t0)<60e3)){ hist.push({t:t0,c:by[k]}); added++; } }
    if(added){ hist.sort((a,b)=>a.t-b.t); saveHist(); renderAll(); }
  }catch(e){}
}
function trendOf(g){
  const f=state.counts[g.id]; if(f==null||state.source==="snapshot"||!g.cap) return null;
  const now=state.ts.getTime(); if(Date.now()-now>20*60e3) return null; // counts too old to say anything about "now"
  let ref=null,best=1e9;
  for(const h of hist){ const age=(now-h.t)/60000; if(age<8||age>50||h.c[g.id]==null) continue; const s=Math.abs(age-20); if(s<best){ best=s; ref=h; } }
  if(!ref) return null;
  const min=(now-ref.t)/60000, d=f-ref.c[g.id];
  if(Math.abs(d)<Math.max(4,g.cap*0.03)) return {k:"steady",d,min:Math.round(min)};
  const fast=Math.abs(d/min*60)>=g.cap*0.2;
  let fullIn=null; if(d<0&&f>0){ const m=f/(-d/min); if(m<=90) fullIn=Math.max(5,Math.round(m/5)*5); }
  return {k:d<0?"filling":"emptying",d,min:Math.round(min),fast,fullIn};
}
function trendColor(tr){ return tr.k==="emptying"?"var(--ok)":tr.fullIn!=null&&tr.fullIn<=30?"var(--bad)":"var(--warn)"; }
function trendShort(tr){
  if(!tr||tr.k==="steady") return "";
  if(tr.k==="filling") return tr.fullIn!=null&&tr.fullIn<=45?t("Full in ~{m} min",{m:tr.fullIn}):t(tr.fast?"Filling fast":"Filling");
  return t(tr.fast?"Emptying fast":"Emptying");
}
function trendInline(g){ const tr=trendOf(g); const s=trendShort(tr); return s?`<b class="tr" style="color:${trendColor(tr)}">${tr.k==="filling"?"↓":"↑"} ${s}</b>`:""; }
function trendStrip(g){
  const f=state.counts[g.id]; if(f==null) return "";
  const tr=trendOf(g);
  if(!tr) return `<div class="trend" style="--c:var(--muted)"><span class="ar">~</span><span>${t("The trend appears after a few minutes of readings.")}</span></div>`;
  const n=Math.abs(tr.d);
  if(tr.k==="steady") return `<div class="trend" style="--c:var(--muted)"><span class="ar">→</span><span>${t("Steady over the last {m} min",{m:tr.min})}</span></div>`;
  const txt=tr.k==="filling"?t("{n} fewer free spots than {m} min ago",{n,m:tr.min}):t("{n} more free spots than {m} min ago",{n,m:tr.min});
  const extra=tr.k==="filling"&&tr.fullIn!=null?` · <b>${t("full in about {m} min at this pace",{m:tr.fullIn})}</b>`:"";
  return `<div class="trend" style="--c:${trendColor(tr)}"><span class="ar">${tr.k==="filling"?"↓":"↑"}</span><span>${txt}${extra}</span></div>`;
}

let chargers=CHARGERS;
const EV_STATUS_URL="https://data.geo.admin.ch/ch.bfe.ladestellen-elektromobilitaet/status/oicp/ch.bfe.ladestellen-elektromobilitaet.json";
const EV_LABEL={Available:"Available",Occupied:"In use",Reserved:"Reserved",OutOfService:"Out of service",Unknown:"Status unknown",EvseNotFound:"Status unknown"};
let evStatus=null, evAt=0, evLoading=null;
async function loadChargerList(){
  try{ const r=await fetch(DATA_BASE+"chargers.json",{cache:"no-store"}); if(!r.ok) return; const d=await r.json();
    if(d&&Array.isArray(d.sites)&&d.sites.length>5){ chargers=d.sites; buildChargerMarkers(); if(evStatus) loadEvStatus(true); else if(state.ev) renderAll(); } }catch(e){}
}
function loadEvStatus(force){
  if(!force&&evStatus&&Date.now()-evAt<3*60e3) return Promise.resolve(); if(evLoading) return evLoading;
  evLoading=(async()=>{
    try{ const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),15000);
      const r=await fetch(EV_STATUS_URL,{cache:"no-store",signal:ctrl.signal}); clearTimeout(tm); if(!r.ok) return; const d=await r.json();
      const want=new Set(chargers.flatMap(s=>s.e)); const m={};
      for(const op of d.EVSEStatuses||[]) for(const x of op.EVSEStatusRecord||[]) if(want.has(x.EvseID)) m[x.EvseID]=x.EVSEStatus;
      evStatus=m; evAt=Date.now(); refreshChargerMarkers();
      if(sheet.classList.contains("detail-mode")&&state.selCharger) openCharger(state.selCharger,false); else renderAll();
    }catch(e){} finally{ evLoading=null; }
  })();
  return evLoading;
}
function siteStatus(s){
  if(!evStatus) return {free:null,total:s.e.length};
  let free=0,known=0; for(const id of s.e){ const v=evStatus[id]; if(!v||v==="Unknown"||v==="EvseNotFound") continue; known++; if(v==="Available") free++; }
  return {free:known?free:null,total:s.e.length};
}
const stColor=st=>st.free==null?"var(--muted)":st.free>0?"var(--ok)":"var(--bad)";
const stText=st=>st.free==null?t("No live data"):t("{n} free of {m}",{n:st.free,m:st.total});
const kwLabel=s=>s.kw?(s.kw>=50?t("Fast")+" · ":"")+s.kw+" kW":t("Power not listed");
function chargingNear(lat,lng,maxKm){ return chargers.map(s=>({s,d:distKm([lat,lng],[s.lat,s.lng])})).filter(x=>x.d<=maxKm).sort((a,b)=>a.d-b.d); }
function chargingSection(g){
  const near=chargingNear(g.lat,g.lng,0.8).slice(0,3);
  const head=`<div class="sec sec-ico">${svgIcon("bolt")} ${t("Charging nearby")}</div>`;
  if(!near.length){ const n=chargingNear(g.lat,g.lng,50)[0];
    return head+`<p class="note" style="margin-top:0">${t("No public charger within 800 m is listed in the federal register.")}${n?" "+t("Nearest: {name}, {d}.",{name:esc(n.s.n),d:fmtDist(n.d)}):""}</p>`; }
  return head+`<div class="rows">${near.map(({s,d})=>{ const st=siteStatus(s); return `<button class="row rowbtn" data-c="${s.id}"><span>${esc(s.n)}<small>${fmtDist(d)} · ${kwLabel(s)}${s.acc==="restricted"?" · "+t("Customers only"):""}</small></span><b style="color:${stColor(st)}">${stText(st)}</b></button>`; }).join("")}</div>`;
}
const chargerLayer=L.layerGroup(); const cmarkers={};
function chargerIcon(s){
  const st=siteStatus(s);
  return L.divIcon({className:"cmark"+(state.selCharger===s.id?" active":""),iconSize:[0,0],iconAnchor:[0,0],
    html:`<div class="pill" style="--c:${stColor(st)}">${svgIcon("bolt")}${st.free==null?s.e.length:st.free+"/"+st.total}</div>`});
}
function buildChargerMarkers(){
  chargerLayer.clearLayers(); for(const k in cmarkers) delete cmarkers[k];
  chargers.forEach(s=>{ const mk=L.marker([s.lat,s.lng],{icon:chargerIcon(s),keyboard:false,zIndexOffset:-50}).addTo(chargerLayer); mk.on("click",()=>openCharger(s.id,true)); cmarkers[s.id]=mk; });
}
function refreshChargerMarkers(){ chargers.forEach(s=>cmarkers[s.id]&&cmarkers[s.id].setIcon(chargerIcon(s))); }
function syncEvLayer(){ if(state.view==="garages"&&state.ev) chargerLayer.addTo(map); else map.removeLayer(chargerLayer); }
function sortedChargers(){
  let sort=state.sort; if(sort==="near"&&!state.pos) sort="centre"; const a=chargers.slice();
  const dc=s=>distKm(LUGANO,[s.lat,s.lng]), fr=s=>{ const v=siteStatus(s).free; return v==null?-1:v; };
  const dd=state.pos?(s=>distKm(state.pos,[s.lat,s.lng])):dc;
  if(sort==="free") a.sort((x,y)=>((fr(y)>0)-(fr(x)>0))||(dd(x)-dd(y))); // any free point first, then the closest
  else if(sort==="near") a.sort((x,y)=>distKm(state.pos,[x.lat,x.lng])-distKm(state.pos,[y.lat,y.lng]));
  else if(sort==="centre") a.sort((x,y)=>dc(x)-dc(y));
  else a.sort((x,y)=>x.n.localeCompare(y.n));
  return a;
}
function renderChargers(sortbar){
  const sts=chargers.map(siteStatus).filter(s=>s.free!=null);
  const free=sts.reduce((n,s)=>n+s.free,0), total=sts.reduce((n,s)=>n+s.total,0);
  $("#head").innerHTML=`<div class="summary"><span class="big num">${evStatus?free:"—"}</span><span class="lbl">${evStatus?t("charge points free of {m}",{m:total}):t("Loading charger status…")}</span><span class="chips"><button class="chip blue" data-ev>${t("Show garages")} ✕</button></span></div>${sortbar}`;
  $("#body").innerHTML=`<div class="list">${sortedChargers().map(s=>{ const st=siteStatus(s); const col=stColor(st); const pct=st.free==null?0:Math.round(st.free/st.total*100); const d=state.pos?distKm(state.pos,[s.lat,s.lng]):null;
    return `<button class="card ${st.free==null?"nodata":""}" data-c="${s.id}" style="--c:${col};--pct:${pct}" aria-label="${esc(s.n)}, ${stText(st)}${d!=null?", "+t("{d} away",{d:fmtDist(d)}):""}">
      <span class="ring"><i>${svgIcon("bolt")}</i></span>
      <span class="t"><h3>${esc(s.n)}</h3><p>${d!=null?`<b class="dist">${fmtDist(d)}</b> · `:""}${kwLabel(s)} · ${esc(s.op)}${s.acc==="restricted"?" · "+t("Customers only"):""}</p></span>
      <span class="n">${st.free==null?`<b>${t("No live data")}</b><small>${st.total===1?t("1 point"):t("{n} points",{n:st.total})}</small>`:`<b class="num">${st.free}</b><small>${t("of {n} free",{n:st.total})}</small>`}</span>
    </button>`; }).join("")}</div>
    <p class="note">${t("Public chargers from the federal register ich-tanke-strom.ch, with live status. Not every operator reports to it, so chargers inside some garages may be missing.")}</p>`;
  fitPeek();
}
function openCharger(id,fly){
  const s=chargers.find(x=>x.id===id); if(!s) return;
  state.selected=null; state.selCharger=id; refreshMarkers(); refreshChargerMarkers();
  const st=siteStatus(s); const col=stColor(st);
  const counts={}; s.e.forEach(e=>{ const v=EV_LABEL[evStatus&&evStatus[e]]||"Status unknown"; counts[v]=(counts[v]||0)+1; });
  const garages=GARAGES.map(g=>({g,d:distKm([s.lat,s.lng],[g.lat,g.lng])})).filter(x=>x.d<0.8).sort((a,b)=>a.d-b.d).slice(0,3);
  $("#dhead").innerHTML=`<div class="dhead"><button class="back" id="back" aria-label="${t("Back to list")}">${svgIcon("back")}</button><div><h2>${esc(s.n)}</h2><p>${esc(s.a)}</p></div></div>`;
  $("#dbody").innerHTML=`
    <div class="hero" style="--c:${col};--pct:${st.free==null?0:Math.round(st.free/st.total*100)}">
      <div class="box"><div class="k">${t("Free now")}</div><div class="v num" style="color:${col}">${st.free==null?"—":st.free}<small> / ${st.total}</small></div><div class="bar"><i></i></div></div>
      <div class="box"><div class="k">${t("Power")}</div><div class="v" style="font-size:20px">${kwLabel(s)}</div><div class="k" style="margin-top:6px">${evStatus?t("Live status"):t("Loading charger status…")}</div></div>
    </div>
    <div class="actions"><a class="btn primary" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=driving" target="_blank" rel="noopener">${svgIcon("nav")} ${t("Navigate")}</a></div>
    <div class="sec">${t("Charge points")}</div>
    <div class="rows">${Object.entries(counts).map(([k,n])=>`<div class="row"><span>${t(k)}</span><b>${n}</b></div>`).join("")}</div>
    <div class="sec">${t("Good to know")}</div>
    <div class="rows"><div class="row"><span>${t("Operator")}</span><b>${esc(s.op)}</b></div><div class="row"><span>${t("Access")}</span><b>${t(s.acc==="restricted"?"Customers or members only":"Public")}</b></div></div>
    <p class="note">${t("Prices depend on the operator and on your charging card or app.")}</p>
    ${garages.length?`<div class="sec">${t("Garages nearby")}</div><div class="rows">${garages.map(({g,d})=>{ const lv=levelOf(g); const f=state.counts[g.id]; return `<button class="row rowbtn" data-g="${g.id}"><span>${g.name}<small>${fmtDist(d)}</small></span><b style="color:${lv.c}">${f==null?t("No live data"):t("{n} free",{n:f})}</b></button>`; }).join("")}</div>`:""}`;
  sheet.classList.add("detail-mode"); if(sheetPos==="peek") setSheet("half"); fitPeek();
  $("#back").addEventListener("click",closeDetail);
  if(fly) map.flyTo([s.lat+0.0018,s.lng],16,{duration:.6});
  loadEvStatus();
}

const HEIGHT={balestra:2.0,motta:1.9,castello:1.9,lac:2.1,bettydo:2.1,sangiuseppe:2.05,centralpark:2.1,campomarzio:"open"};

let favs=[]; try{ const f=JSON.parse(localStorage.getItem("lp.fav")||"[]"); if(Array.isArray(f)) favs=f; }catch(e){}
const isFav=id=>favs.includes(id);
function toggleFav(id){
  favs=isFav(id)?favs.filter(x=>x!==id):favs.concat(id); try{ localStorage.setItem("lp.fav",JSON.stringify(favs)); }catch(e){}
  toast(t(isFav(id)?"Pinned to the top of the list":"Removed from favourites")); renderAll();
}
// Favourites first, garages the vehicle does not fit into last; otherwise keep the chosen order.
function pinSort(a){ const low=g=>fitsVeh(g)===false?1:0; return a.map((g,i)=>({g,i})).sort((x,y)=>(isFav(y.g.id)-isFav(x.g.id))||(low(x.g)-low(y.g))||(x.i-y.i)).map(x=>x.g); }
const favMark=g=>isFav(g.id)?`<span class="star" aria-label="${t("Favourite")}">★</span> `:"";

const garageUrl=g=>location.origin+location.pathname+"#"+g.id;
function shareGarage(id){
  const g=GARAGES.find(x=>x.id===id); if(!g) return; const url=garageUrl(g); const f=state.counts[g.id];
  const text=f!=null?t("{name}: {n} free right now",{name:g.name,n:f}):g.name;
  if(navigator.share){ navigator.share({title:g.name+" · Lugano Parking",text,url}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast(t("Link copied"))).catch(()=>toast(url)); }
  else toast(url);
}
function openFromHash(){

  if(state.view!=="garages") setView("garages"); openGarage(g.id,true); return true;
}

const DURS=[[0.5,"30 min"],[1,"1 h"],[2,"2 h"],[3,"3 h"],[4,"4 h"],[8,"Day"]];

const CENTRE_STOP=[46.0050,8.9515]; // TPL hub "Lugano Centro", where the P+R buses arrive
const WALK_M_PER_MIN=80, ROUTE_FACTOR=1.3;
// Straight-line distance scaled by a typical street factor. Honest "about" figures, no routing service needed.
function walkMin(a,b){ return Math.max(1,Math.ceil(distKm(a,b)*1000*ROUTE_FACTOR/WALK_M_PER_MIN)); }
function tripTo(g,dest){
  const direct=walkMin([g.lat,g.lng],dest); const walk={min:direct,mode:"walk",label:t("{m} min",{m:direct}),dist:fmtDist(distKm([g.lat,g.lng],dest)*ROUTE_FACTOR)}; walk.sub=t("{d} walk",{d:walk.dist});
  if(g.tariff==="PR"){ const w=walkMin(CENTRE_STOP,dest); const bus={min:12+w,mode:"bus",label:t("{m} min",{m:12+w}),sub:t("bus {n} + {m} min walk",{n:g.id==="resega"?t("3 or 8"):"1",m:w})}; if(bus.min<direct) return bus; }
  return walk;
}
function costFor(g,h){
  if(g.tariff==="A"||g.tariff==="LAC"){ const tbl=[[0.5,0],[1,2],[2,4],[3,6],[4,10],[8,26],[24,43]]; const row=tbl.find(([k])=>h<=k)||tbl[tbl.length-1]; return {chf:row[1],approx:row[0]!==h,note:row[1]===0?t("first 30 min free"):""}; }
  if(g.tariff==="CP"){ const tbl=[[0.5,1],[1,2],[2,4],[3,6],[4,8],[5,10],[6,12],[8,16],[12,23]]; const row=tbl.find(([k])=>h<=k)||tbl[tbl.length-1]; return {chf:row[1],approx:row[0]!==h||h===8,note:""}; }
  if(g.tariff==="SG"){ if(h>4) return {chf:null,approx:false,note:t("price at the entrance")}; const tbl=[[0.25,0],[1,1],[2,3],[3,6],[4,10]]; const row=tbl.find(([k])=>h<=k); return {chf:row[1],approx:row[0]!==h,note:""}; }
  if(g.tariff==="RAIL"){ return {chf:16,approx:false,note:t("SBB P+Rail day ticket")}; }
  if(g.tariff==="PR"){ const hourly=h*1; const day=5.20; return hourly<day?{chf:hourly,approx:false,note:""}:{chf:day,approx:false,note:t("day ticket incl. TPL bus")}; }
  return {chf:null,approx:false,note:t("price at the entrance")};
}
function fmtChf(c){ return c==null?"—":c===0?t("Free"):"CHF "+(Number.isInteger(c)?c:c.toFixed(2)); }
function rankedForDest(){
  const d=[state.dest.lat,state.dest.lng]; const h=state.hours;
  const rows=GARAGES.map(g=>{ const lv=levelOf(g); const f=state.counts[g.id]; const trip=tripTo(g,d); const cost=costFor(g,h);
    const full=f===0; let pen=full?1e6:lv.k==="bad"?15:lv.k==="warn"?5:lv.k==="nodata"?((lastReport(g)??99)<=30?0:3):0; const tr=trendOf(g); if(!full&&tr&&tr.k==="filling"&&tr.fullIn!=null&&tr.fullIn<=30) pen+=8; if(eventAvoids(g)) pen+=20; if(fitsVeh(g)===false) pen+=1e5;
    const costGuess=cost.chf==null?costFor({tariff:"A"},h).chf:cost.chf; // unknown operator price: assume the city tariff
    return {g,lv,f,trip,cost,full,score:trip.min+pen+costGuess}; });
  const low=r=>fitsVeh(r.g)===false?1:0;
  if(state.gsort==="walk") rows.sort((a,b)=>(low(a)-low(b))||(a.full-b.full)||(a.trip.min-b.trip.min));
  else if(state.gsort==="cost") rows.sort((a,b)=>(low(a)-low(b))||(a.full-b.full)||((a.cost.chf??99)-(b.cost.chf??99))||(a.trip.min-b.trip.min));
  else rows.sort((a,b)=>a.score-b.score);
  return rows;
}
// Street options near the destination: blue zone or meter bays that allow the stay, with what they cost right now.
function streetOptions(dest,h){
  const r=nowRules(); const out=[];
  ZONES.forEach(z=>{ if(z.type==="yellow") return;
    z.areas.forEach(a=>{ const dk=areaDist(dest,a.p); if(dk>0.6) return; const m=Math.max(1,Math.ceil(dk*1000*ROUTE_FACTOR/WALK_M_PER_MIN));
      let ok=true, chf=0, sub="";
      if(z.type==="blue"){ if(r.blue){ if(h>1) ok=false; else sub=t("disc, max 1 h"); } else sub=t("Free now")+" · "+t("Enforced again {t}",{t:r.nextBlue}); }
      else { if(r.meters){ if(h>z.maxH) ok=false; else { const row=z.feeH.find(([k])=>h<=k)||z.feeH[z.feeH.length-1]; chf=row[1]; sub=t("max {x}",{x:z.rule.replace(/^.*max /,"")}); } } else sub=t("Free now")+" · "+t("Paid again {t}",{t:r.nextMet}); }
      if(!ok) return;
      out.push({z,a,min:m,chf,sub,dist:dk,score:m+chf+(z.type==="blue"?0:1)});
    });
  });
  out.sort((x,y)=>x.score-y.score); return out.slice(0,2);
}

/* ---------- Time rules ---------- */
function fmtTime(d){return d.toLocaleTimeString(LOCALE[LANG]||"en-GB",{hour:"2-digit",minute:"2-digit"});}
function fmtStamp(d){const now=new Date(); const same=d.toDateString()===now.toDateString(); return (same?"":d.toLocaleDateString(LOCALE[LANG]||"en-GB",{day:"numeric",month:"short"})+" ")+fmtTime(d);}
function nowRules(d){
  d=d||new Date(); const day=d.getDay(); const h=d.getHours()+d.getMinutes()/60; const sun=day===0;
  const blue=!sun&&h>=8&&h<18; const meters=!sun&&h>=7&&h<19;
  const nextBlue=blue?t("until {t}",{t:"18:00"}):(sun?t("on Monday from {t}",{t:"08:00"}):(h<8?t("from {t}",{t:"08:00"}):t("tomorrow from {t}",{t:"08:00"})));
  const nextMet=meters?t("until {t}",{t:"19:00"}):(sun?t("on Monday from {t}",{t:"07:00"}):(h<7?t("from {t}",{t:"07:00"}):t("tomorrow from {t}",{t:"07:00"})));
  return {blue,meters,sun,nextBlue,nextMet};
}
function discLeaveBy(hhmm){
  const [H,M]=hhmm.split(":").map(Number); if(isNaN(H)) return null;
  const a=H*60+M;
  if(a<8*60) return {by:"09:00",time:"09:00",tomorrow:false,why:t("Arriving before 08:00: the disc counts from 08:00, so you may stay until 09:00.")};
  if(a>=18*60) return {by:t("09:00 tomorrow"),time:"09:00",tomorrow:true,why:t("Arriving after 18:00: free overnight. Set the disc to 08:00 for the next working day.")};
  const mark=Math.ceil(a/30)*30; const by=mark+60; const pad=n=>String(n).padStart(2,"0"); const tm=`${pad(Math.floor(by/60))}:${pad(by%60)}`;
  return {by:tm,time:tm,tomorrow:false,why:t("Set the disc to {t} (the next half-hour mark). One hour from there.",{t:`${pad(Math.floor(mark/60))}:${pad(mark%60)}`})};
}

  let y0=0,start=0,moved=false,active=false; const h=()=>sheet.getBoundingClientRect().height;
  const posY=()=>({peek:h()-peekPx(),half:h()*0.46,full:0});

  function move(e){ if(!active) return; const dy=e.clientY-y0; if(Math.abs(dy)>6) moved=true; if(!moved) return; const y=Math.max(0,Math.min(h()-80,start+dy)); sheet.style.transform=`translateY(${y}px)`; if(e.cancelable) e.preventDefault(); }

function closeDetail(){ if(location.hash){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} } sheet.classList.remove("detail-mode"); state.selected=null; const hadC=state.selCharger; state.selCharger=null; refreshMarkers(); if(hadC) refreshChargerMarkers(); fitPeek(); }
function setView(v){
  state.view=v; closeDetail();
  document.querySelectorAll("[role=tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===v)));
  if(state.picking){ state.picking=false; $("#map").classList.remove("picking"); }
  if(v==="garages"){ map.removeLayer(zoneLayer); map.removeLayer(destLayer); garageLayer.addTo(map); renderGarages(); }
  else if(v==="going"){ map.removeLayer(zoneLayer); garageLayer.addTo(map); destLayer.addTo(map); renderGoing(); if(state.dest) fitDest(); }
  else { garageLayer.remove(); map.removeLayer(destLayer); zoneLayer.addTo(map); renderStreet(); map.flyTo([46.008,8.955],14.5,{duration:.5}); }
  syncEvLayer();
  if(sheetPos==="peek") setSheet("half");
  if(v==="going"&&!state.dest&&sheetPos!=="full") setSheet("full");
  try{ localStorage.setItem("lp.view",v); }catch(e){}
  countView(v);
}
function toggleEv(){
  state.ev=!state.ev; try{ localStorage.setItem("lp.ev",state.ev?"1":""); }catch(e){}
  syncEvLayer(); renderGarages();
  if(state.ev){ loadEvStatus(); const near=chargers.filter(c=>distKm(LUGANO,[c.lat,c.lng])<3.5).map(c=>[c.lat,c.lng]);
    if(near.length) map.flyToBounds(L.latLngBounds(near.concat([LUGANO])),{paddingTopLeft:[36,110],paddingBottomRight:[36,Math.round(window.innerHeight*0.5)],maxZoom:15,duration:.6}); }
}
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2200); }

// Privacy-friendly visitor counter (GoatCounter, no cookies). Only loads when a site code is set and we're not on localhost.

/* ---------- Events ---------- */
// The app container must never scroll (focus or scrollIntoView can nudge it); the sheet body is the only scroller.
app.addEventListener("scroll",()=>{ app.scrollTop=0; app.scrollLeft=0; });
window.addEventListener("scroll",()=>{ window.scrollTo(0,0); });
document.addEventListener("click",e=>{
  const tab=e.target.closest("[role=tab]"); if(tab){ setView(tab.dataset.view); return; }
  const ev=e.target.closest("[data-ev]"); if(ev){ toggleEv(); return; }
  if(e.target.closest("[data-filters]")){ state.fopen=!state.fopen; renderAll(); return; }
  const vv=e.target.closest("[data-vehv]"); if(vv){ setVeh(parseFloat(vv.dataset.vehv)); return; }
  const fv=e.target.closest("[data-fav]"); if(fv){ toggleFav(fv.dataset.fav); return; }
  const sg=e.target.closest("[data-share-g]"); if(sg){ shareGarage(sg.dataset.shareG); return; }
  if(e.target.closest("[data-evopen]")){ setSheet("half"); const b=$("#body"); if(b) b.scrollTop=0; return; }
  if(e.target.closest(".vsel")) return;
  const ch=e.target.closest("[data-c]"); if(ch){ openCharger(ch.dataset.c,true); return; }
  const s=e.target.closest("[data-sort]"); if(s){ state.sort=s.dataset.sort; renderGarages(); if(state.sort==="near"&&!state.pos) locate(); return; }
  const g=e.target.closest("[data-g]"); if(g){ openGarage(g.dataset.g,true); return; }
  const z=e.target.closest("[data-z]"); if(z){ openZone(z.dataset.z,null); return; }
  const sp=e.target.closest("[data-spot]"); if(sp){ setDest(SPOTS.find(x=>x.id===sp.dataset.spot)); return; }
  const rs=e.target.closest("[data-res]"); if(rs){ const it=$("#results")._items; if(it) setDest(it[+rs.dataset.res]); return; }
  const du=e.target.closest("[data-dur]"); if(du){ state.hours=parseFloat(du.dataset.dur); try{ localStorage.setItem("lp.hours",String(state.hours)); }catch(_){} renderGoing(); return; }
  const gs=e.target.closest("[data-gsort]"); if(gs){ state.gsort=gs.dataset.gsort; renderGoing(); return; }
  const lg=e.target.closest("[data-lang]"); if(lg){ applyLang(lg.dataset.lang); return; }
  if(e.target.closest("#clear-dest")){ setDest(null); return; }
  const pk=e.target.closest("[data-park]"); if(pk){ parkHere(GARAGES.find(x=>x.id===pk.dataset.park)); return; }
  if(e.target.closest("[data-unpark]")||e.target.closest("#parked-clear")){ setParked(null); return; }
  if(e.target.closest("#share-dest")){ shareDest(); return; }
  if(e.target.closest("#pick")){ state.picking=!state.picking; $("#map").classList.toggle("picking",state.picking); if(state.picking){ setSheet("peek"); toast(t("Tap the map where you are going")); } renderGoing(); return; }
  if(e.target.closest("#about-btn")){ openAbout(); return; }
  if(e.target.closest("#about-close")||e.target.id==="about"){ closeAbout(); return; }
  if(e.target.closest("#install-btn")||e.target.closest("#banner-how")){ if(deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.then(()=>{ deferredInstall=null; renderAbout(); }); dismissBanner(); } else { dismissBanner(); openAbout(); } return; }
  if(e.target.closest("#banner-no")){ dismissBanner(); return; }
});
map.on("click",e=>{ if(state.view==="going"&&state.picking){ setDest({name:t("Pinned spot"),sub:e.latlng.lat.toFixed(4)+", "+e.latlng.lng.toFixed(4),lat:e.latlng.lat,lng:e.latlng.lng}); if(sheetPos==="peek") setSheet("half"); } });
$("#refresh").addEventListener("click",()=>refresh(true));
document.addEventListener("change",e=>{
  const vs=e.target.closest("[data-veh]"); if(!vs) return;
  state.veh=parseFloat(vs.value)||0; try{ localStorage.setItem("lp.veh",String(state.veh)); }catch(_){}
  if(state.veh){ const n=GARAGES.filter(g=>fitsVeh(g)===false).length; toast(n?t("{n} garages are too low for this vehicle",{n}):t("All garages with a listed height fit")); }
  renderAll();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("#about").hidden) closeAbout(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pauseWatch(); else { refresh(false); if(state.geo&&watchId==null) locate(); } });
setInterval(()=>{ if(!document.hidden) refresh(false); },3*60*1000);
setInterval(()=>{ if(state.view==="street"&&!sheet.classList.contains("detail-mode")) renderStreet(); statusLine(); },60*1000);
window.addEventListener("resize",fitTop);

/* ---------- Theme colour for the browser chrome ---------- */
function syncThemeColor(){ const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--surface").trim()||"#0f6f78"); }
if(window.matchMedia){ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncThemeColor); }

/* ---------- Offline / instant reopen ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had) toast(t("App updated · reopen to get the new version")); had=true; });
}

/* ---------- Boot ---------- */
try{ state.ev=localStorage.getItem("lp.ev")==="1"; }catch(e){}
loadHist(); renderChrome(); loadCounts(); buildMarkers(); buildChargerMarkers(); buildZones(); syncThemeColor(); loadParked(); renderParked(); armReminder(); loadTypical(); initCounter(); loadRecentLog(); loadChargerList(); if(state.ev) loadEvStatus(); loadEvents(); loadReports(true);
let v="garages"; try{ v=localStorage.getItem("lp.view")||"garages"; }catch(e){}
try{ const d=JSON.parse(sessionStorage.getItem("lp.dest")||"null"); if(d&&d.lat) state.dest=d; }catch(e){}
(function fromLink(){ // ?to=lat,lng&n=Name&h=2 opens the app on a shared destination
  const u=new URL(location.href); const to=(u.searchParams.get("to")||"").split(","); if(to.length!==2||isNaN(+to[0])||isNaN(+to[1])) return;
  state.dest={name:(u.searchParams.get("n")||t("Shared spot")).slice(0,60),sub:"",lat:+to[0],lng:+to[1]}; const h=parseFloat(u.searchParams.get("h")); if(h>0&&DURS.some(x=>x[0]===h)) state.hours=h; v="going";
  history.replaceState(null,"",location.pathname);
})();
if(state.dest) setDest(state.dest,false);
if(v==="going"&&!state.dest) v="garages";
if(location.hash&&GARAGES.some(g=>"#"+g.id===location.hash.toLowerCase())) v="garages";
if(v==="street"||v==="going") setView(v); else { renderGarages(); statusLine(); countView("garages"); }
openFromHash();
refresh(false); setTimeout(maybeInstallBanner,2500);
})();
</script>
</body>
</html>
