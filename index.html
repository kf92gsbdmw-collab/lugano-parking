<style>
/* Layout: one-screen map app. Map fills the viewport; a floating header on top, a draggable sheet from the bottom. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eef1f0; --fg:#15201e; --muted:#5f6b68; --line:#dde3e1;
  --accent:#0f6f78; --accent-ink:#ffffff; --accent-soft:#dff0f1;
  --ok:#1f8a4c; --ok-soft:#dcf3e4; --warn:#c7791a; --warn-soft:#fbeed9; --bad:#c8362f; --bad-soft:#f9e1df;
  --blue:#2a62c9; --blue-soft:#dbe6fa; --white-zone:#6b5bd2; --white-soft:#e7e3f8; --yellow:#b58a00; --yellow-soft:#f6edc6;
  --shadow:0 8px 28px rgba(16,32,30,.16), 0 1px 3px rgba(16,32,30,.08);
  --font-display:"Sora","Instrument Sans",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --map-filter:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#1a2220; --surface-2:#232d2b; --fg:#eef3f1; --muted:#9aa8a4; --line:#2f3b38;
  --accent:#4fb8c0; --accent-ink:#0b1514; --accent-soft:#163a3d;
  --ok:#4fc77f; --ok-soft:#173d28; --warn:#e5a04a; --warn-soft:#3f2d14; --bad:#ef6b63; --bad-soft:#45201e;
  --blue:#6f9cf0; --blue-soft:#1d2d4d; --white-zone:#a89cf3; --white-soft:#2b2650; --yellow:#e2c14e; --yellow-soft:#3c3414;
  --shadow:0 8px 28px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --map-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#1a2220; --surface-2:#232d2b; --fg:#eef3f1; --muted:#9aa8a4; --line:#2f3b38;
  --accent:#4fb8c0; --accent-ink:#0b1514; --accent-soft:#163a3d;
  --ok:#4fc77f; --ok-soft:#173d28; --warn:#e5a04a; --warn-soft:#3f2d14; --bad:#ef6b63; --bad-soft:#45201e;

  --map-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.7);
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;width:100%;overflow:hidden;--peek:124px}
#map{position:absolute;inset:0;background:var(--bg);z-index:0}
#map .leaflet-tile-pane{filter:var(--map-filter)}
.leaflet-container{font-family:var(--font-body)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);padding:2px 6px}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-bottom.leaflet-right{bottom:calc(var(--peek,124px) + 6px)}
.leaflet-top.leaflet-left .leaflet-control-zoom{margin-top:calc(env(safe-area-inset-top,0px) + 134px);margin-left:12px;border:0;box-shadow:var(--shadow);border-radius:12px;overflow:hidden}
.leaflet-bar a{background:var(--surface);color:var(--fg);border-bottom-color:var(--line);width:36px;height:36px;line-height:36px}
.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-bar a.leaflet-disabled{color:var(--muted);background:var(--surface-2)}
.leaflet-top.leaflet-left .leaflet-control-locate{margin-left:12px;margin-top:8px;border:0;box-shadow:var(--shadow);border-radius:12px;overflow:hidden}
.leaflet-control-locate .locate{width:36px;height:36px;display:grid;place-items:center;background:var(--surface);color:var(--fg)}
.leaflet-control-locate .locate svg{width:19px;height:19px}
.leaflet-control-locate .locate.on{color:var(--accent)}
.leaflet-control-locate .locate.locating svg{animation:pulse 1s ease-in-out infinite}

GARAGES.forEach(g=>state.counts[g.id]=g.free);

function levelOf(g){
  const f=state.counts[g.id];
  if(f==null) return {k:"nodata",c:"var(--muted)",t:"No live data"};
  const pct=f/g.cap;
  if(f===0) return {k:"bad",c:"var(--bad)",t:"Full"};
  if(f<15||pct<0.08) return {k:"bad",c:"var(--bad)",t:"Almost full"};
  if(pct<0.25) return {k:"warn",c:"var(--warn)",t:"Filling up"};
  return {k:"ok",c:"var(--ok)",t:"Plenty of space"};
}
const FEED="https://www.lugano.ch/vivere-lugano/muoversi-lugano/posteggi/content/0.html?ajax=true&ajaxAction=map";
function parseFeed(html){
  const out={}; const re=/<h5 class="mb-2">([^<]+)<\/h5>[\s\S]*?Posteggi liberi<\/strong><br>\s*(\d+)/g; let m;
  while((m=re.exec(html))){ const nm=m[1].split(" - ")[0].trim(); const g=GARAGES.find(x=>x.feedName===nm); if(g) out[g.id]=+m[2]; }
  return out;
}
async function fetchLive(){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),7000);
  try{ const r=await fetch(FEED,{signal:ctrl.signal,cache:"no-store"}); if(!r.ok) throw 0; const c=parseFeed(await r.text()); if(Object.keys(c).length<3) throw 0; return c; }
  finally{ clearTimeout(t); }
}
function applyCounts(c,source,ts){
  Object.assign(state.counts,c); state.source=source; state.ts=ts; renderAll(); if(source==="live") saveCounts();
}
async function refresh(manual){
  const b=$("#refresh"); b.classList.add("spin");
  try{ const c=await fetchLive(); applyCounts(c,"live",new Date()); if(manual) toast("Updated from the city feed"); }
  catch(e){ if(manual) toast("City feed not reachable from here · showing "+(state.source==="stored"?"the last stored update":"the saved snapshot")); }
  finally{ b.classList.remove("spin"); }
}
// Remember the last live counts so a reopen with no network still shows something recent.
function saveCounts(){ try{ localStorage.setItem("lp.counts",JSON.stringify({ts:state.ts.toISOString(),counts:state.counts})); }catch(e){} }
function loadCounts(){
  try{ const d=JSON.parse(localStorage.getItem("lp.counts")||"null"); if(!d||!d.counts) return; const ts=new Date(d.ts); if(ts>state.ts){ Object.assign(state.counts,d.counts); state.source="stored"; state.ts=ts; } }catch(e){}
}

/* ---------- Location ---------- */
const LUGANO=[46.0036,8.9513];
function distKm(a,b){ const R=6371, toR=x=>x*Math.PI/180; const dLat=toR(b[0]-a[0]), dLng=toR(b[1]-a[1]); const h=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function fmtDist(km){ return km<0.95?Math.round(km*100)*10+" m":km<10?km.toFixed(1).replace(".0","")+" km":Math.round(km)+" km"; }
function garageDist(g){ return state.pos?distKm(state.pos,[g.lat,g.lng]):null; }
function inPoly(pt,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1]; if(((yi>pt[0])!==(yj>pt[0]))&&(pt[1]<(xj-xi)*(pt[0]-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
function zoneAt(pt){ for(const z of ZONES) for(const a of z.areas) if(inPoly(pt,a.p)) return {z,a}; return null; }
let watchId=null, meMarker=null, meCircle=null, locBtn=null;
function geoError(e){
  state.geo=false; if(locBtn) locBtn.classList.remove("locating");
  const msg=e&&e.code===1?"Location is off for this site · allow it in your browser settings":e&&e.code===3?"Could not get a fix · try again outside":"Location not available right now";
  toast(msg);
}
function onPosition(p){
  const pt=[p.coords.latitude,p.coords.longitude]; const first=!state.pos; const moved=first||distKm(state.pos,pt)>0.03;
  state.pos=pt; state.geo=true; if(locBtn){ locBtn.classList.remove("locating"); locBtn.classList.add("on"); }
  if(!meMarker){ meMarker=L.marker(pt,{icon:L.divIcon({className:"me",iconSize:[0,0],html:'<span class="halo"></span><span class="pin"></span>'}),interactive:false,zIndexOffset:-100,keyboard:false}).addTo(map); }
  else meMarker.setLatLng(pt);
  const acc=p.coords.accuracy||0;
  if(acc>25&&acc<600){ if(!meCircle) meCircle=L.circle(pt,{radius:acc,weight:0,fillColor:"#2a7fff",fillOpacity:.1,interactive:false}).addTo(map); else { meCircle.setLatLng(pt); meCircle.setRadius(acc); } }
  else if(meCircle){ meCircle.remove(); meCircle=null; }
  if(first){
    const far=distKm(pt,LUGANO);
    if(far>25){ toast("You are "+fmtDist(far)+" from Lugano · garages sorted by distance anyway"); }
    else if(state.view==="garages"){ const near=sortedGarages("near")[0]; const b=L.latLngBounds([pt,[near.lat,near.lng]]); map.flyToBounds(b,{paddingTopLeft:[40,170],paddingBottomRight:[40,Math.round(window.innerHeight*0.5)],maxZoom:16,duration:.7}); }
    else map.flyTo(pt,15.5,{duration:.7});
    if(state.view==="garages"&&!sheet.classList.contains("detail-mode")){ state.sort="near"; if(sheetPos==="peek") setSheet("half"); }
  }
  if(moved) renderAll();
  if(watchId==null&&navigator.geolocation){ watchId=navigator.geolocation.watchPosition(onPosition,()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:20000}); }
}
function locate(){
  if(!navigator.geolocation){ toast("Location is not supported on this device"); return; }
  if(locBtn) locBtn.classList.add("locating");
  if(state.pos&&meMarker){ map.flyTo(state.pos,Math.max(map.getZoom(),15.5),{duration:.5}); }
  navigator.geolocation.getCurrentPosition(onPosition,geoError,{enableHighAccuracy:true,maximumAge:30000,timeout:12000});
}
function pauseWatch(){ if(watchId!=null&&navigator.geolocation){ navigator.geolocation.clearWatch(watchId); watchId=null; } }

/* ---------- Time rules ---------- */
function fmtTime(d){return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}
function fmtStamp(d){const now=new Date(); const same=d.toDateString()===now.toDateString(); return (same?"":d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" ")+fmtTime(d);}
function nowRules(d){
  d=d||new Date(); const day=d.getDay(); const h=d.getHours()+d.getMinutes()/60; const sun=day===0;
  const blue=!sun&&h>=8&&h<18; const meters=!sun&&h>=7&&h<19;
  const nextBlue=blue?`until 18:00`:(sun?"on Monday from 08:00":(h<8?"from 08:00":"tomorrow from 08:00"));
  const nextMet=meters?`until 19:00`:(sun?"on Monday from 07:00":(h<7?"from 07:00":"tomorrow from 07:00"));
  return {blue,meters,sun,nextBlue,nextMet};
}
function discLeaveBy(hhmm){
  const [H,M]=hhmm.split(":").map(Number); if(isNaN(H)) return null;
  const a=H*60+M;
  if(a<8*60) return {by:"09:00",why:"Arriving before 08:00: the disc counts from 08:00, so you may stay until 09:00."};
  if(a>=18*60) return {by:"09:00 tomorrow",why:"Arriving after 18:00: free overnight. Set the disc to 08:00 for the next working day."};
  const mark=Math.ceil(a/30)*30; const by=mark+60; const pad=n=>String(n).padStart(2,"0");
  return {by:`${pad(Math.floor(by/60))}:${pad(by%60)}`,why:`Set the disc to ${pad(Math.floor(mark/60))}:${pad(mark%60)} (the next half-hour mark). One hour from there.`};
}

/* ---------- Map ---------- */
const map=L.map("map",{zoomControl:true,attributionControl:true,minZoom:14,maxZoom:18,zoomSnap:0.5,inertia:true}).setView([46.0055,8.953],15);
map.attributionControl.setPrefix("");
map.attributionControl.addAttribution('Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Garages: Città di Lugano');
// Offline basemap: one pre-rendered mosaic per zoom level (tiles/z*.jpg), sliced into tiles on a canvas.
// Only the zoom level in view is downloaded; the service worker keeps them for offline use afterwards.
const MOSAICS={14:{x0:8598,y0:5826,nx:3,ny:4},15:{x0:17196,y0:11653,nx:6,ny:7},16:{x0:34392,y0:23306,nx:12,ny:14},17:{x0:68789,y0:46623,nx:14,ny:11}};
const Mosaic=L.GridLayer.extend({
  createTile:function(coords,done){
    const c=document.createElement("canvas"); c.width=c.height=256; const ctx=c.getContext("2d");
    const m=MOSAICS[coords.z]; ctx.fillStyle="#eef0ef"; ctx.fillRect(0,0,256,256);
    if(m){ const img=mosaicImg(coords.z); const draw=()=>{ const sx=(coords.x-m.x0)*256, sy=(coords.y-m.y0)*256; if(sx>=0&&sy>=0&&sx<m.nx*256&&sy<m.ny*256) ctx.drawImage(img,sx,sy,256,256,0,0,256,256); setTimeout(()=>done(null,c),0); }; if(img.complete&&img.naturalWidth) draw(); else { img.addEventListener("load",draw,{once:true}); img.addEventListener("error",()=>setTimeout(()=>done(null,c),0),{once:true}); } }
    else setTimeout(()=>done(null,c),0);
    return c;
  }
});
const imgCache={};
function mosaicImg(z){ if(!imgCache[z]){ const i=new Image(); i.decoding="async"; i.src="tiles/z"+z+".jpg"; imgCache[z]=i; } return imgCache[z]; }
new Mosaic({minZoom:14,maxZoom:18,maxNativeZoom:17,minNativeZoom:14,tileSize:256,updateWhenIdle:false,keepBuffer:3}).addTo(map);

// "Where am I" button under the zoom control
const Locate=L.Control.extend({
  onAdd:function(){
    const d=L.DomUtil.create("div","leaflet-bar leaflet-control leaflet-control-locate");
    locBtn=L.DomUtil.create("button","locate",d); locBtn.type="button"; locBtn.setAttribute("aria-label","Show my location"); locBtn.title="My location";
    locBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
    L.DomEvent.disableClickPropagation(d); L.DomEvent.on(locBtn,"click",locate);
    return d;
  }
});
new Locate({position:"topleft"}).addTo(map);

const garageLayer=L.layerGroup().addTo(map);
const zoneLayer=L.layerGroup();
const markers={};
function garageIcon(g){
  const lv=levelOf(g); const f=state.counts[g.id];
  return L.divIcon({className:"gmark"+(lv.k==="nodata"?" nodata":"")+(state.selected===g.id?" active":""),iconSize:[0,0],iconAnchor:[0,0],
    html:`<div class="pill" style="--c:${lv.c}"><span class="p">P</span>${f==null?"P+R":f}</div>`});
}
function buildMarkers(){
  garageLayer.clearLayers();
  GARAGES.forEach(g=>{ const mk=L.marker([g.lat,g.lng],{icon:garageIcon(g),keyboard:false}).addTo(garageLayer); mk.on("click",()=>openGarage(g.id,true)); markers[g.id]=mk; });
}
function refreshMarkers(){ GARAGES.forEach(g=>markers[g.id]&&markers[g.id].setIcon(garageIcon(g))); }
const zoneShapes={};
function buildZones(){
  ZONES.forEach(z=>z.areas.forEach(a=>{
    const col=getComputedStyle(document.documentElement).getPropertyValue(z.type==="blue"?"--blue":"--white-zone").trim();
    const poly=L.polygon(a.p,{color:col,weight:1.5,dashArray:z.type==="blue"?null:"5 4",fillColor:col,fillOpacity:.16,opacity:.8}).addTo(zoneLayer);
    poly.on("click",()=>openZone(z.id,a.n));
    const ctr=poly.getBounds().getCenter();
    const lab=L.marker(ctr,{icon:L.divIcon({className:"zlabel",iconSize:[0,0],html:`<span style="--c:${z.c}">${z.type==="blue"?"Blue":"Meters "+z.id.replace("z","Z")} · ${a.n}</span>`}),interactive:false}).addTo(zoneLayer);
    (zoneShapes[z.id]=zoneShapes[z.id]||[]).push(poly);
  }));
}
function recolorZones(){ zoneLayer.clearLayers(); for(const k in zoneShapes) delete zoneShapes[k]; buildZones(); }
if(window.matchMedia){ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>recolorZones()); }
new MutationObserver(()=>recolorZones()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ---------- Sheet ---------- */
const sheet=$("#sheet"); const app=$("#app"); let sheetPos="peek";
function peekPx(){ return parseFloat(getComputedStyle(app).getPropertyValue("--peek"))||124; }
function fitPeek(){ const head=sheet.classList.contains("detail-mode")?$("#dhead"):$("#head"); app.style.setProperty("--peek",(head.offsetHeight+26)+"px"); }
function setSheet(p){ sheetPos=p; sheet.classList.remove("half","full"); if(p!=="peek") sheet.classList.add(p); }
(function drag(){
  let y0=0,start=0,moved=false,active=false; const h=()=>sheet.getBoundingClientRect().height;
  const posY=()=>({peek:h()-peekPx(),half:h()*0.46,full:0});
  function down(e){ if(e.target.closest(".body")&&sheetPos==="full") return; /* fully open: the list scrolls instead */ if(e.target.closest("input,a,.back")) return; active=true;moved=false;y0=e.clientY;start=posY()[sheetPos];sheet.classList.add("dragging"); }
  function move(e){ if(!active) return; const dy=e.clientY-y0; if(Math.abs(dy)>6) moved=true; if(!moved) return; const y=Math.max(0,Math.min(h()-80,start+dy)); sheet.style.transform=`translateY(${y}px)`; if(e.cancelable) e.preventDefault(); }
  function up(e){ if(!active) return; active=false; sheet.classList.remove("dragging"); sheet.style.transform=""; if(!moved) return; const y=start+(e.clientY-y0); const P=posY(); const d=Object.entries(P).sort((a,b)=>Math.abs(a[1]-y)-Math.abs(b[1]-y)); setSheet(d[0][0]); }
  sheet.addEventListener("pointerdown",down); window.addEventListener("pointermove",move,{passive:false}); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
  $("#grip").addEventListener("click",()=>setSheet(sheetPos==="peek"?"half":sheetPos==="half"?"full":"peek"));
})();

/* ---------- Rendering ---------- */
function svgIcon(n){
  const S='fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
  if(n==="back") return `<svg viewBox="0 0 24 24" ${S}><path d="M15 18l-6-6 6-6"/></svg>`;
  if(n==="nav") return `<svg viewBox="0 0 24 24" ${S}><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>`;
  if(n==="disc") return `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
  if(n==="meter") return `<svg viewBox="0 0 24 24" ${S}><rect x="7" y="3" width="10" height="12" rx="3"/><path d="M12 15v6M10 21h4M10 9h4"/></svg>`;
  if(n==="ban") return `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/></svg>`;
  if(n==="loc") return `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>`;
  return "";
}
function statusLine(){
  const dot=$("#dot"); const s=$("#status");
  const age=(Date.now()-state.ts.getTime())/60000;
  dot.className="dot"+(age>90?" stale":"");
  const src=state.source==="live"?"Live":state.source==="stored"?"Stored":"Snapshot";
  s.textContent=`${src} · updated ${fmtStamp(state.ts)}`;
}
function sortedGarages(sort){
  sort=sort||state.sort; const a=GARAGES.slice();
  if(sort==="near"&&!state.pos) sort="centre";
  if(sort==="free") a.sort((x,y)=>((state.counts[y.id]??-1)-(state.counts[x.id]??-1)));
  else if(sort==="near") a.sort((x,y)=>garageDist(x)-garageDist(y));
  else if(sort==="centre"){ const d=g=>distKm(LUGANO,[g.lat,g.lng]); a.sort((x,y)=>d(x)-d(y)); }
  else a.sort((x,y)=>x.name.localeCompare(y.name));
  return a;
}
function renderGarages(){
  const withData=GARAGES.filter(g=>state.counts[g.id]!=null);
  const free=withData.reduce((s,g)=>s+state.counts[g.id],0);
  const full=withData.filter(g=>state.counts[g.id]===0).length;
  $("#head").innerHTML=`<div class="summary"><span class="big num">${free.toLocaleString("de-CH")}</span><span class="lbl">free spots in ${withData.length} garages</span><span class="chips">${full?`<span class="chip bad">${full} full</span>`:`<span class="chip ok">none full</span>`}</span></div>
  <div class="sortbar" role="group" aria-label="Sort">${[["near",state.pos?"Nearest":"Near me"],["free","Most free"],["centre","Closest to centre"],["name","A–Z"]].map(([k,l])=>`<button data-sort="${k}" aria-pressed="${state.sort===k}">${k==="near"?svgIcon("loc")+" ":""}${l}</button>`).join("")}</div>`;
  $("#body").innerHTML=`<div class="list">${sortedGarages().map(g=>{ const lv=levelOf(g); const f=state.counts[g.id]; const pct=f==null?0:Math.round(f/g.cap*100); const d=garageDist(g);
    return `<button class="card ${lv.k==="nodata"?"nodata":""}" data-g="${g.id}" style="--c:${lv.c};--pct:${pct}" aria-label="${g.name}, ${f==null?"no live data":f+" free of "+g.cap}${d!=null?", "+fmtDist(d)+" away":""}">
      <span class="ring"><i>${f==null?"—":pct+"%"}</i></span>
      <span class="t"><h3>${g.name}</h3><p>${d!=null?`<b class="dist">${fmtDist(d)}</b> · `:""}${g.area} · ${lv.t}${g.tags[0]&&d==null?" · "+g.tags[0]:""}</p></span>
      <span class="n">${f==null?`<b>No live data</b><small>${g.cap} spaces</small>`:`<b class="num">${f}</b><small>of ${g.cap} free</small>`}</span>
    </button>`;}).join("")}</div>
    <p class="note">Garage counts come from the Città di Lugano real-time feed. Colours: green means plenty of space, amber means it is filling up, red means full or nearly full.</p>`;
  fitPeek();
}
function renderStreet(){
  const r=nowRules();
  $("#head").innerHTML=`<div class="summary"><span class="big" style="font-size:20px">Street parking right now</span></div>
  <div class="now">
    <div class="tile" style="--c:var(--blue);--soft:var(--blue-soft)"><div class="k">${svgIcon("disc")} Blue zone</div><div class="v">${r.blue?"Disc · max 1 h":"Free, no limit"}</div><div class="s">${r.blue?"Enforced "+r.nextBlue:"Enforced again "+r.nextBlue}</div></div>
    <div class="tile" style="--c:var(--white-zone);--soft:var(--white-soft)"><div class="k">${svgIcon("meter")} Meters</div><div class="v">${r.meters?"Paid":"Free"}</div><div class="s">${r.meters?"Paid "+r.nextMet:"Paid again "+r.nextMet}</div></div>
  </div>`;
  let here="";
  if(state.pos){
    const hit=distKm(state.pos,LUGANO)<25?zoneAt(state.pos):null;
    if(hit){ const z=hit.z; const active=z.type==="blue"?r.blue:z.type==="white"?r.meters:true;
      here=`<div class="sec">Where you are</div><div class="list"><button class="card zcard here" data-z="${z.id}" style="--c:${z.c};--soft:${z.soft}"><span class="sw">${svgIcon(z.type==="blue"?"disc":z.type==="white"?"meter":"ban")}</span><span class="t"><h3>${z.short} · ${hit.a.n}</h3><p>${active?(z.type==="blue"?"Disc, max 1 h, "+r.nextBlue:z.rule+", "+r.nextMet):"Free right now · "+(z.type==="blue"?"enforced again "+r.nextBlue:"paid again "+r.nextMet)}</p></span><span class="n"><span class="st">${z.type==="blue"?(r.blue?"Disc now":"Free now"):(r.meters?"Paid now":"Free now")}</span></span></button></div>`; }
    else here=`<div class="sec">Where you are</div><p class="note here-none">${svgIcon("loc")} No marked zone outline at your position. Check the lines and the sign at the bay.</p>`;
  }
  $("#body").innerHTML=`${here}<div class="sec">Zones on the map</div><div class="list">${ZONES.map(z=>`<button class="card zcard" data-z="${z.id}" style="--c:${z.c};--soft:${z.soft}">
      <span class="sw">${svgIcon(z.type==="blue"?"disc":z.type==="white"?"meter":"ban")}</span>
      <span class="t"><h3>${z.name}</h3><p>${z.rule} · ${z.when}</p></span>
      <span class="n"><span class="st">${z.type==="yellow"?"Avoid":z.type==="blue"?(r.blue?"Disc now":"Free now"):(r.meters?"Paid now":"Free now")}</span></span>
    </button>`).join("")}</div>
    <div class="sec">How to read the markings</div>
    <div class="legend">
      <div><i style="--c:var(--blue);--soft:var(--blue-soft)"></i>Blue lines: parking disc, 1 hour, Mon–Sat 08:00–18:00</div>
      <div><i style="--c:var(--white-zone);--soft:var(--white-soft)"></i>White lines with a meter: pay, Mon–Sat 07:00–19:00, time limit per zone</div>
      <div><i style="--c:var(--yellow);--soft:var(--yellow-soft)"></i>Yellow lines: reserved, never park</div>
    </div>
    <p class="note">Zone outlines are indicative and show where each type of bay is typical, not every single space. The sign at the bay always wins. Hours and tariffs follow the city ordinance 2.2.1 (in force since 2023, meter tariffs as last amended).</p>`;
  fitPeek();
}
function renderAll(){ statusLine(); refreshMarkers(); if(state.view==="garages") renderGarages(); else renderStreet(); if(state.selected&&sheet.classList.contains("detail-mode")) { const g=GARAGES.find(x=>x.id===state.selected); if(g) openGarage(g.id,false); } }

function openGarage(id,fly){
  const g=GARAGES.find(x=>x.id===id); if(!g) return; state.selected=id; refreshMarkers();
  const lv=levelOf(g); const f=state.counts[g.id]; const pct=f==null?0:Math.round(f/g.cap*100); const T=TARIFFS[g.tariff];
  const maps=`https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}&travelmode=driving`;
  $("#dhead").innerHTML=`<div class="dhead"><button class="back" id="back" aria-label="Back to list">${svgIcon("back")}</button><div><h2>${g.name}</h2><p>${g.addr}</p></div></div>`;
  $("#dbody").innerHTML=`
    <div class="hero" style="--c:${lv.c};--pct:${pct}">
      <div class="box"><div class="k">Free now</div><div class="v num" style="color:${lv.c}">${f==null?"—":f}<small> / ${g.cap}</small></div><div class="bar"><i></i></div></div>
      <div class="box"><div class="k">Status</div><div class="v" style="font-size:20px">${lv.t}</div><div class="k" style="margin-top:6px">${f==null?"Occupancy not published":"Updated "+fmtStamp(state.ts)}</div></div>
    </div>
    <div class="actions"><a class="btn primary" href="${maps}" target="_blank" rel="noopener">${svgIcon("nav")} Navigate</a><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(g.name+", Lugano")}" target="_blank" rel="noopener">Open in Maps</a></div>
    <div class="sec">${T.label}</div>
    ${T.rows.length?`<div class="tariff">${T.rows.map(([k,v])=>`<div><b>${v}</b><small>${k}</small></div>`).join("")}</div>`:""}
    <p class="note">${T.night?T.night+". ":""}${T.extra}</p>
    <div class="sec">Good to know</div>
    <div class="rows">${state.pos?`<div class="row"><span>From you</span><b>${fmtDist(garageDist(g))}</b></div>`:""}${g.tags.map((t,i)=>`<div class="row"><span>${i?"":"Tip"}</span><b>${t}</b></div>`).join("")}<div class="row"><span>Area</span><b>${g.area}</b></div>${T.hours?`<div class="row"><span>Hours</span><b>${T.hours}</b></div>`:""}<div class="row"><span>Capacity</span><b>${g.cap} spaces</b></div></div>`;
  sheet.classList.add("detail-mode"); if(sheetPos==="peek") setSheet("half");
  $("#back").addEventListener("click",closeDetail);
  if(fly) map.flyTo([g.lat+0.0018,g.lng],16.5,{duration:.6});
}
function openZone(id,areaName){
  const z=ZONES.find(x=>x.id===id); if(!z) return; const r=nowRules();
  const active=z.type==="blue"?r.blue:z.type==="white"?r.meters:true;
  $("#dhead").innerHTML=`<div class="dhead"><button class="back" id="back" aria-label="Back to list">${svgIcon("back")}</button><div><h2>${z.name}</h2><p>${areaName?areaName+" · ":""}${z.rule}</p></div></div>`;
  $("#dbody").innerHTML=`
    <div class="hero" style="--c:${z.c}">
      <div class="box" style="background:${z.soft}"><div class="k" style="color:${z.c}">Right now</div><div class="v" style="font-size:20px">${z.type==="yellow"?"Reserved":active?(z.type==="blue"?"Disc, max 1 h":"Paid, max "+z.rule.replace("Paid, max ",""))+"":"Free, no limit"}</div></div>
      <div class="box"><div class="k">Enforced</div><div class="v" style="font-size:18px">${z.when}</div><div class="k" style="margin-top:6px">${z.type==="yellow"?"":"Sundays and holidays free"}</div></div>
    </div>
    <p class="note" style="font-size:14px;color:var(--fg)">${z.desc}</p>
    ${z.fee?`<div class="sec">Tariff</div><div class="tariff">${z.fee.map(([k,v])=>`<div><b>${v}</b><small>${k}</small></div>`).join("")}</div>`:""}
    ${z.type==="blue"?`<div class="sec">Parking disc helper</div><div class="disc"><label for="arr">I arrive at</label><input id="arr" type="time" value="${fmtTime(new Date())}"><div class="out" id="discout"></div></div>`:""}
    ${z.areas.length?`<div class="sec">Where</div><div class="rows">${z.areas.map(a=>`<div class="row"><span>${z.type==="blue"?"Quartiere":"Area"}</span><b>${a.n}</b></div>`).join("")}</div>`:""}
    <p class="note">Outline on the map is indicative. Follow the signs and markings at the bay.</p>`;
  sheet.classList.add("detail-mode"); if(sheetPos==="peek") setSheet("half");
  $("#back").addEventListener("click",closeDetail);
  const arr=$("#arr"); if(arr){ const upd=()=>{ const o=discLeaveBy(arr.value); $("#discout").innerHTML=o?`Leave by <b>${o.by}</b><span style="color:var(--muted)">${o.why}</span>`:""; }; arr.addEventListener("input",upd); upd(); }
  const shapes=zoneShapes[id]; if(shapes&&shapes.length){ const b=L.latLngBounds([]); shapes.forEach(s=>b.extend(s.getBounds())); map.flyToBounds(b,{paddingTopLeft:[20,170],paddingBottomRight:[20,Math.round(window.innerHeight*0.5)],duration:.6,maxZoom:16}); }
}
function closeDetail(){ sheet.classList.remove("detail-mode"); state.selected=null; refreshMarkers(); fitPeek(); }
function setView(v){
  state.view=v; closeDetail();
  document.querySelectorAll(".seg [role=tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===v)));
  if(v==="garages"){ map.removeLayer(zoneLayer); garageLayer.addTo(map); renderGarages(); }
  else { garageLayer.remove(); zoneLayer.addTo(map); renderStreet(); map.flyTo([46.008,8.955],14.5,{duration:.5}); }
  if(sheetPos==="peek") setSheet("half");
  try{ localStorage.setItem("lp.view",v); }catch(e){}
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- Events ---------- */
// The app container must never scroll (focus or scrollIntoView can nudge it); the sheet body is the only scroller.
app.addEventListener("scroll",()=>{ app.scrollTop=0; app.scrollLeft=0; });
window.addEventListener("scroll",()=>{ window.scrollTo(0,0); });
document.addEventListener("click",e=>{
  const tab=e.target.closest(".seg [role=tab]"); if(tab){ setView(tab.dataset.view); return; }
  const s=e.target.closest("[data-sort]"); if(s){ state.sort=s.dataset.sort; renderGarages(); if(state.sort==="near"&&!state.pos) locate(); return; }
  const g=e.target.closest("[data-g]"); if(g){ openGarage(g.dataset.g,true); return; }
  const z=e.target.closest("[data-z]"); if(z){ openZone(z.dataset.z,null); return; }
});
$("#refresh").addEventListener("click",()=>refresh(true));
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pauseWatch(); else { refresh(false); if(state.geo&&watchId==null) locate(); } });
setInterval(()=>{ if(!document.hidden) refresh(false); },3*60*1000);
setInterval(()=>{ if(state.view==="street"&&!sheet.classList.contains("detail-mode")) renderStreet(); statusLine(); },60*1000);

/* ---------- Theme colour for the browser chrome ---------- */
function syncThemeColor(){ const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--surface").trim()||"#0f6f78"); }
if(window.matchMedia){ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncThemeColor); }

/* ---------- Offline / instant reopen ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had) toast("App updated · reopen to get the new version"); had=true; });
}

/* ---------- Boot ---------- */
loadCounts(); buildMarkers(); buildZones(); syncThemeColor();
let v="garages"; try{ v=localStorage.getItem("lp.view")||"garages"; }catch(e){}
if(v==="street") setView("street"); else { renderGarages(); statusLine(); }
refresh(false);
})();
</script>
</body>
</html>
